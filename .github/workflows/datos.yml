name: Datos
on:
  schedule:
    - cron: "0 9 * * 1"
  push:
    paths: [".github/workflows/datos.yml", "scripts/cifras.sh"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar datos públicos
        run: |
          mkdir -p data
          curl -sSfL -A "Mozilla/5.0" https://fotodeteccion.ansv.gov.co/map/data/sast.json -o data/ansv-sast.json
          curl -sSfL "https://www.datos.gov.co/api/views/72nf-y4v3.json" -o data/simit-meta.json
          curl -sSfL "https://www.datos.gov.co/resource/72nf-y4v3.json?\$limit=50" -o data/simit-muestra.json
          ls -la data
      - name: Resumir cifras
        run: scripts/cifras.sh
      - name: Guardar cambios
        run: |
          git config user.name "slondono-dev"
          git config user.email "jslondono145@gmail.com"
          git add data
          git diff --cached --quiet || git commit -m "Update public data"
          git push
