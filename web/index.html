<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1565c0">
<title>Alerta Comparendos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#f5f7fa;--fg:#1a1a1a;--card:#fff;--acc:#1565c0;--err:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--fg:#eee;--card:#1e1e1e;--acc:#64b5f6}}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:560px;margin:auto;padding:16px}
h1{font-size:1.4rem}
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px}
input,select,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;font-size:1rem;border-radius:8px;border:1px solid #8884}
button{background:var(--acc);color:#fff;border:0;font-weight:600}
.err{color:var(--err)}
pre{white-space:pre-wrap;word-break:break-word;font-size:.8rem}
</style>
</head>
<body>
<main>
<h1>Alerta Comparendos</h1>
<div class="card">
  <select id="portal"></select>
  <select id="tipo"><option value="placa">Placa</option><option value="cedula">Cédula</option></select>
  <input id="criterio" placeholder="ABC123" autocapitalize="characters">
  <button id="go">Consultar</button>
  <details><summary>Proxy (opcional)</summary>
    <input id="proxy" placeholder="https://mi-proxy.example/?url=">
    <small>Los portales bloquean llamadas desde el navegador (CORS). Si tienes un proxy, ponlo aquí; la URL destino se añade al final.</small>
  </details>
</div>
<div id="out"></div>
</main>
<script src="app.js"></script>
</body>
</html>
